name: Build real railway routes

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_railway_routes.py"
      - ".github/workflows/build-railway-routes.yml"

permissions:
  contents: write

concurrency:
  group: build-railway-routes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build route geometry from OSM
        env:
          ROUTE_KEYS: kostelec_u_jihlavy:jihlava,jihlava:luka_nad_jihlavou,luka_nad_jihlavou:okrisky,okrisky:trebic,trebic:studenec,studenec:rosice_u_brna,rosice_u_brna:brno_hlavni_nadrazi,praha:uvaly,uvaly:pecky,pecky:kolin
        run: python scripts/build_railway_routes.py
      - name: Validate JavaScript syntax
        run: node --check stations/preparedRoutes.js
      - name: Commit updated route bundle
        run: |
          if git diff --quiet -- stations/preparedRoutes.js; then
            echo "No route changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations/preparedRoutes.js
          git commit -m "Build real railway route geometry"
          git pull --rebase origin main
          git push
