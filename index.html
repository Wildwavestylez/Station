<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Train Ops - Framework Edition</title>

  <!-- 🗺️ Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

 <!-- 🎨 Hlavní styl -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🍔 Tlačítko pro otevření menu -->
  <button id="menu-btn" onclick="toggleSidebar()">☰</button>

  <!-- 🗂️ Vysouvací boční panel pro přepínání nádraží (World of Airports styl) -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>Moje Impérium</h3>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <!-- Sem JavaScript dynamicky vykreslí seznam všech nádraží ve hře -->
    <div id="station-list"></div>
<button id="reset-btn" onclick="resetGameState()">☢️ RESETOVAT HRU</button>
  
  </div>

  <!-- 🗺️ Mapa hry -->
  <div id="map"></div>

  <!-- 📦 Uživatelské rozhraní (UI) -->
  <div id="ui">
    <div id="top">
      💰 <span id="money">0</span> Kč | 🚉 <span id="station-name">Načítání...</span> | Koleje: <span id="tracks-count">0/0</span> | ⭐️ <span id="level-info">LVL 0 (0/0 XP)</span>
    </div>

    <div id="content">
      <!-- Seznam vlaků čekajících před stanicí / na kolejích -->
      <div id="queue"></div>

      <!-- Detail vybraného vlaku -->
      <div id="detail">
        <h3 id="name">Vyber vlak</h3>
        <p id="state">---</p>

        <img id="img" style="display:none;"/>

        <div class="bar"><div id="p1" class="fill"></div></div>
        <div class="bar"><div id="p2" class="fill"></div></div>
        <div class="bar"><div id="p3" class="fill"></div></div>

        <div id="actions"></div>
      </div>
    </div>
  </div>


  <!-- 🗺️ Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 📊 Globální konfigurace hráče -->
  <script src="data.js"></script> 

  <!-- 🚉 Datové balíčky jednotlivých měst -->
  <script src="stations/plzen.js"></script>
   <script src="stations/karlsruhe.js"></script> 

 <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
</script>

  <!-- 🎮 Hlavní herní motor (Engine) -->
  <script src="game.js"></script>

</body>
</html>
